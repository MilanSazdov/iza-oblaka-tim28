name: Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-and-deploy:
    name: Package Lambdas and run Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Package Lambdas
        run: |
          set -euxo pipefail
          mkdir -p infra/build
          # "<source dir>:<zip name>" (zip names must be unique across layers)
          functions="
            lambdas/bronze/hacker_news:hacker_news
            lambdas/bronze/twitter:twitter
            lambdas/notifier/discord:discord
            lambdas/silver/hacker_news:silver_hacker_news
            lambdas/silver/twitter:silver_twitter
            lambdas/gold/hn:gold_hn
            lambdas/gold/twitter:gold_twitter
          "
          for entry in $functions; do
            fn="${entry%%:*}"
            name="${entry##*:}"
            stage="infra/build/${name}_stage"
            rm -rf "$stage" "infra/build/${name}.zip"
            mkdir -p "$stage"
            cp "$fn"/*.py "$stage/"
            # include any shared layer module (e.g. lambdas/silver/common.py,
            # lambdas/gold/goldlib.py) sitting next to the function dir
            cp "$(dirname "$fn")"/*.py "$stage/" 2>/dev/null || true
            if grep -qvE '^\s*(#.*)?$' "$fn/requirements.txt" 2>/dev/null; then
              pip install --no-cache-dir -r "$fn/requirements.txt" -t "$stage/"
            fi
            (cd "$stage" && zip -qr "../${name}.zip" .)
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Terraform Format Check
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: infra
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: infra
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra
        env:
          TF_VAR_discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: infra
        env:
          TF_VAR_discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: terraform apply -input=false -auto-approve tfplan
